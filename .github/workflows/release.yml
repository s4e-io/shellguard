name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Install msitools (MSI build)
        run: sudo apt-get update && sudo apt-get install -y msitools wixl

      - name: Build all platforms
        run: |
          mkdir -p dist

          GOOS=darwin  GOARCH=arm64  go build -trimpath -ldflags="-s -w" -o dist/shellguard-darwin-arm64   ./cmd/shellguard/
          GOOS=darwin  GOARCH=amd64  go build -trimpath -ldflags="-s -w" -o dist/shellguard-darwin-amd64   ./cmd/shellguard/
          GOOS=linux   GOARCH=arm64  go build -trimpath -ldflags="-s -w" -o dist/shellguard-linux-arm64    ./cmd/shellguard/
          GOOS=linux   GOARCH=amd64  go build -trimpath -ldflags="-s -w" -o dist/shellguard-linux-amd64    ./cmd/shellguard/
          GOOS=windows GOARCH=amd64  go build -trimpath -ldflags="-s -w" -o dist/shellguard-windows-amd64.exe ./cmd/shellguard/

          # Windows installer (setup exe per arch), MSI and the config signing tool
          bash scripts/build-windows.sh
          cp dist/windows/ShellGuardSetup-amd64.exe dist/windows/ShellGuardSetup-arm64.exe \
             dist/windows/shellguard-sign.exe dist/windows/ShellGuard-*-x64.msi dist/

          # SHA256 checksums
          cd dist
          sha256sum shellguard-* ShellGuard* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shellguard-darwin-arm64
            dist/shellguard-darwin-amd64
            dist/shellguard-linux-arm64
            dist/shellguard-linux-amd64
            dist/shellguard-windows-amd64.exe
            dist/ShellGuardSetup-amd64.exe
            dist/ShellGuardSetup-arm64.exe
            dist/ShellGuard-*-x64.msi
            dist/shellguard-sign.exe
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## Installation

            **macOS (Apple Silicon)**
            ```bash
            curl -Lo shellguard https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shellguard-darwin-arm64
            chmod +x shellguard && sudo mv shellguard /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -Lo shellguard https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shellguard-darwin-amd64
            chmod +x shellguard && sudo mv shellguard /usr/local/bin/
            ```

            **Linux (x86_64)**
            ```bash
            curl -Lo shellguard https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shellguard-linux-amd64
            chmod +x shellguard && sudo mv shellguard /usr/local/bin/
            ```

            See the [README](https://github.com/${{ github.repository }}#readme) for full setup instructions.
