name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build all platforms
        run: |
          mkdir -p dist

          GOOS=darwin  GOARCH=arm64  go build -ldflags="-s -w" -o dist/shellguard-darwin-arm64   ./cmd/shellguard/
          GOOS=darwin  GOARCH=amd64  go build -ldflags="-s -w" -o dist/shellguard-darwin-amd64   ./cmd/shellguard/
          GOOS=linux   GOARCH=arm64  go build -ldflags="-s -w" -o dist/shellguard-linux-arm64    ./cmd/shellguard/
          GOOS=linux   GOARCH=amd64  go build -ldflags="-s -w" -o dist/shellguard-linux-amd64    ./cmd/shellguard/
          GOOS=windows GOARCH=amd64  go build -ldflags="-s -w" -o dist/shellguard-windows-amd64.exe ./cmd/shellguard/

          # SHA256 checksums
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/shellguard-darwin-arm64
            dist/shellguard-darwin-amd64
            dist/shellguard-linux-arm64
            dist/shellguard-linux-amd64
            dist/shellguard-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
          body: |
            ## Installation

            **macOS (Apple Silicon)**
            ```bash
            curl -Lo shellguard https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shellguard-darwin-arm64
            chmod +x shellguard && sudo mv shellguard /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -Lo shellguard https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shellguard-darwin-amd64
            chmod +x shellguard && sudo mv shellguard /usr/local/bin/
            ```

            **Linux (x86_64)**
            ```bash
            curl -Lo shellguard https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/shellguard-linux-amd64
            chmod +x shellguard && sudo mv shellguard /usr/local/bin/
            ```

            See the [README](https://github.com/${{ github.repository }}#readme) for full setup instructions.
